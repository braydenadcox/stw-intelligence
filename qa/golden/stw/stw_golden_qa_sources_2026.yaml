maintainer_note: >-
  These sources are expert evidence, not canonical game data. Dates indicate when the
  video was published, not that every numerical claim was independently runtime-tested.
  Use source_currentness together with each QA case's enforcement and verification fields.

currentness_policy:
  current_2026: Published in 2026 and eligible to support current QA expectations.
  historical_unverified: Published before 2026; useful only after asset or runtime confirmation.
  version_sensitive: Describes behavior that may be bugged, undocumented, or patch-dependent.

