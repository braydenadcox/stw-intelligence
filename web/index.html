<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>STW Intelligence</title>
  <style>
    :root{
      color-scheme:dark;--bg:#070b12;--panel:#0e1521;--card:#131d2c;--card2:#182438;
      --line:#26344a;--text:#f4f8ff;--muted:#93a4bd;--blue:#63d4ff;--purple:#a98cff;
      --green:#55daa1;--amber:#ffc861;--red:#ff7082;--shadow:0 18px 50px rgba(0,0,0,.28)
    }
    *{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:
      radial-gradient(circle at 90% -10%,rgba(99,212,255,.13),transparent 35%),var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}
    aside{position:sticky;top:0;height:100vh;padding:22px 14px;background:rgba(9,14,23,.93);border-right:1px solid var(--line);backdrop-filter:blur(18px)}
    .brand{display:flex;gap:11px;align-items:center;padding:0 8px 22px}.brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 0 30px rgba(99,212,255,.24);display:grid;place-items:center;color:#07101a;font-weight:900}.brand b{font-size:16px}.brand small{display:block;color:var(--muted)}
    nav{display:grid;gap:4px}.nav-title{padding:18px 12px 6px;color:#667892;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.nav-button{border:0;background:transparent;color:#aebed3;padding:10px 12px;border-radius:9px;text-align:left;display:flex;gap:10px;align-items:center}.nav-button:hover{background:#111c2b;color:white}.nav-button.active{background:linear-gradient(90deg,rgba(99,212,255,.15),rgba(169,140,255,.08));color:var(--blue);box-shadow:inset 2px 0 var(--blue)}
    .status{position:absolute;bottom:16px;left:16px;right:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0b121d;color:var(--muted);font-size:11px}.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}
    main{min-width:0}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,3vw,42px);border-bottom:1px solid rgba(38,52,74,.7);background:rgba(7,11,18,.72);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}.topbar h1{font-size:18px;margin:0}.provider-pill{padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.page{max-width:1450px;margin:auto;padding:28px clamp(18px,3vw,42px) 60px}
    .hero{padding:24px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,rgba(99,212,255,.09),rgba(169,140,255,.06)),var(--panel);box-shadow:var(--shadow);margin-bottom:18px}.hero h2{font-size:25px;margin:0 0 6px}.hero p{color:var(--muted);margin:0;max-width:760px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}.panel{padding:18px}.card{padding:15px}.stack{display:grid;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.split{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{color:var(--muted)}.label{color:#7f91aa;text-transform:uppercase;letter-spacing:.11em;font-size:10px}.value{font-size:18px;font-weight:700;margin-top:3px}.error{padding:12px;border:1px solid rgba(255,112,130,.45);background:rgba(255,112,130,.1);border-radius:10px;color:#ffc3cb}.notice{padding:12px;border:1px solid rgba(255,200,97,.42);background:rgba(255,200,97,.1);border-radius:10px;color:#ffe0a5}
    .btn{border:1px solid var(--line);background:#172337;color:var(--text);padding:9px 13px;border-radius:9px}.btn:hover{border-color:#49617f}.btn.primary{border:0;color:#06111a;background:linear-gradient(135deg,var(--blue),#7cb7ff);font-weight:750}.btn.ghost{background:transparent}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
    input,select,textarea{width:100%;color:var(--text);background:#0a111c;border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(99,212,255,.09)}textarea{resize:vertical;min-height:90px}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:11px;color:var(--muted)}input[type=checkbox]{width:auto}input[type=range]{padding:0;border:0}.check{display:flex;gap:8px;align-items:center;color:var(--muted)}
    .chat{min-height:620px;display:flex;flex-direction:column}.messages{display:grid;gap:16px;flex:1;align-content:start;padding:4px 2px 18px}.message{max-width:92%;padding:14px 16px;border-radius:14px}.message.user{justify-self:end;background:linear-gradient(135deg,#1e3c55,#24335c);border-bottom-right-radius:4px}.message.assistant{justify-self:start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;width:min(100%,900px)}.message p{margin:0}.composer{position:sticky;bottom:0;padding-top:12px;background:linear-gradient(transparent,var(--panel) 18%)}.compose-row{display:grid;grid-template-columns:1fr auto;gap:9px}.compose-row textarea{min-height:54px;max-height:160px}.suggestions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.suggestion{background:#111b29;border:1px solid var(--line);border-radius:999px;color:#aebed3;padding:6px 10px;font-size:11px}
    .progress{padding:15px;border:1px solid var(--line);border-radius:13px;background:#0b121d}.progress-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.spinner{width:17px;height:17px;border:2px solid #31506b;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.step{height:4px;background:#223047;border-radius:4px}.step.done,.step.active{background:linear-gradient(90deg,var(--blue),var(--purple))}.progress small{color:var(--muted)}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.06em}.supported{background:rgba(85,218,161,.12);color:var(--green);border:1px solid rgba(85,218,161,.3)}.partial{background:rgba(255,200,97,.12);color:var(--amber);border:1px solid rgba(255,200,97,.3)}.opaque{background:rgba(255,112,130,.12);color:#ff9dac;border:1px solid rgba(255,112,130,.3)}
    .build{margin-top:13px;border:1px solid #31445f;background:#101a28;border-radius:14px;overflow:hidden}.build-head{padding:16px;background:linear-gradient(110deg,rgba(99,212,255,.1),rgba(169,140,255,.08));display:flex;justify-content:space-between;gap:12px}.build-head h3{margin:0;font-size:18px}.build-body{padding:15px}.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.slot{padding:10px;border-radius:9px;background:#0b131f;border:1px solid #22324a}.slot b{display:block;margin-top:2px}.scores{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.score{padding:7px 9px;background:#0b131f;border-radius:8px;color:#aebed3;font-size:11px}.synergy{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid #213048}.synergy-num{width:24px;height:24px;border-radius:50%;background:#1f354d;color:var(--blue);display:grid;place-items:center;font-size:10px}.details{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.details summary{cursor:pointer;color:#b9c9dc}.evidence{font-size:12px;padding:8px;border-left:2px solid var(--line);margin:6px 0;color:#aebed3}.evidence.partial{border-color:var(--amber);background:transparent}.evidence.opaque{border-color:var(--red);background:transparent}
    .history-list{display:grid;gap:6px;max-height:260px;overflow:auto}.history-item{padding:9px;border:1px solid transparent;border-radius:8px;color:#aebed3;cursor:pointer}.history-item:hover,.history-item.active{border-color:var(--line);background:#111b29;color:white}
    table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px}tbody tr:hover{background:#121d2c}.timeline{list-style:none;padding:0}.timeline li{padding:9px 0;border-bottom:1px solid var(--line)}
    .inventory-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}.inventory-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.inventory-item.owned{border-color:rgba(85,218,161,.45)}
    .compare-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.empty{padding:45px 20px;text-align:center;color:var(--muted)}
    @media(max-width:1050px){.layout{grid-template-columns:1fr}.controls{order:-1}.compare-grid{grid-template-columns:1fr}}
    @media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;padding:10px}.brand,.nav-title,.status{display:none}nav{display:flex;overflow:auto}.nav-button{white-space:nowrap}.topbar{position:static}.page{padding:18px 12px}.message{max-width:100%}.steps{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="brandmark">STW</div><div><b>STW Intelligence</b><small>Loadout specialist</small></div></div>
    <nav id="nav">
      <div class="nav-title">Loadout AI</div>
      <button class="nav-button active" data-view="chat">✦ AI Chat</button>
      <button class="nav-button" data-view="analyzer">◈ Build Analyzer</button>
      <button class="nav-button" data-view="inventory">◇ Inventory</button>
      <button class="nav-button" data-view="compare">⇄ Compare Builds</button>
      <div class="nav-title">Matchmaking</div>
      <button class="nav-button" data-view="live">● Live</button>
      <button class="nav-button" data-view="history">◷ History</button>
      <button class="nav-button" data-view="activity">⌁ Activity</button>
      <button class="nav-button" data-view="missions">▦ Missions</button>
      <button class="nav-button" data-view="settings">⚙ Settings</button>
    </nav>
    <div class="status"><i></i><span id="health">Starting local services…</span></div>
  </aside>
  <main><div class="topbar"><h1 id="pageTitle">AI Loadout Specialist</h1><span class="provider-pill" id="provider">Local AI</span></div><div class="page" id="content"></div></main>
</div>
<script>
const content=document.querySelector('#content'), health=document.querySelector('#health'), providerEl=document.querySelector('#provider'), titleEl=document.querySelector('#pageTitle');
const state={view:'chat',conversationId:null,conversation:null,job:null,pinned:[],selectedAttempt:null,inventory:[],provider:null,objects:{},objectSeq:0};
const titles={chat:'AI Loadout Specialist',analyzer:'Build Analyzer',inventory:'Owned Collection',compare:'Build Comparison',live:'Live Matchmaking',history:'Attempt History',activity:'Observed Activity',missions:'Mission Rotation',settings:'Settings & Diagnostics'};
const esc=v=>String(v??'Unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v==null||v===''?'Unknown':esc(v), secs=v=>v==null?'Unknown':`${Number(v).toFixed(2)}s`, jsonHeaders={'Content-Type':'application/json'};
function registerObject(value){const id=`obj${++state.objectSeq}`;state.objects[id]=value;return id}
async function api(path,options={}){const r=await fetch(path,options),text=await r.text();let d;try{d=JSON.parse(text)}catch{d={error:text||r.statusText}}if(!r.ok)throw new Error(d.error||`${r.status}`);return d}
const post=(path,value)=>api(path,{method:'POST',headers:jsonHeaders,body:JSON.stringify(value)});
document.querySelectorAll('.nav-button').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
function navigate(view){state.view=view;state.selectedAttempt=null;titleEl.textContent=titles[view];document.querySelectorAll('.nav-button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));render()}
function badge(status){status=status==='high'?'supported':status==='medium'?'partial':status==='low'?'opaque':status||'partial';return `<span class="badge ${esc(status)}">${esc(status)}</span>`}
function errorBox(e){content.innerHTML=`<div class="error"><b>Something went wrong</b><br>${esc(e.message||e)}</div>`}
function quick(text){document.querySelector('#chatInput').value=text;document.querySelector('#chatInput').focus()}
function objectivePatch(){const get=id=>Number(document.querySelector(`#${id}`)?.value||0);const values={sustained_damage:get('goalDamage'),survivability:get('goalSurvival'),crowd_control:get('goalControl'),ability_uptime:get('goalUptime')};return Object.fromEntries(Object.entries(values).filter(([,v])=>v>0))}
function chatPatch(){const value=id=>document.querySelector(`#${id}`)?.value.trim()||null,patch={},objectives=objectivePatch();if(Object.keys(objectives).length)patch.objective_weights=objectives;if(value('ctxMission'))patch.mission=value('ctxMission');if(value('ctxEnemy'))patch.target_enemy=value('ctxEnemy');if(value('ctxPl'))patch.power_level=Number(value('ctxPl'));if(value('ctxStorm'))patch.elemental_storm=value('ctxStorm');const avoid=value('ctxAvoid');if(avoid)patch.avoid_conditions=avoid.split(',').map(x=>x.trim()).filter(Boolean);return patch}
async function sendChat(){const input=document.querySelector('#chatInput'),request=input.value.trim();if(!request||state.job)return;input.value='';const payload={request,conversation_id:state.conversationId,intent_patch:chatPatch(),restrict_to_owned:document.querySelector('#restrictOwned').checked};renderOptimistic(request);try{const job=await post('/api/ai/jobs',payload);state.conversationId=job.conversation_id;state.job=job;pollJob(job.id)}catch(e){state.job=null;errorBox(e)}}
function renderOptimistic(request){const messages=[...(state.conversation?.messages||[]),{role:'user',content:request}];document.querySelector('#messages').innerHTML=messages.map(messageHtml).join('')+progressHtml({stage:'understanding_request',detail:'Starting…',progress:[]});document.querySelector('#messages').lastElementChild?.scrollIntoView({behavior:'smooth'})}
async function pollJob(id){try{const job=await api(`/api/ai/jobs/${id}`);state.job=job;const progress=document.querySelector('#jobProgress');if(progress)progress.outerHTML=progressHtml(job);if(job.status==='completed'){state.job=null;await loadConversation(job.conversation_id);renderChat()}else if(job.status==='failed'){state.job=null;const p=document.querySelector('#jobProgress');if(p)p.outerHTML=`<div class="error">${esc(job.error)}</div>`;else errorBox(job.error)}else setTimeout(()=>pollJob(id),500)}catch(e){state.job=null;errorBox(e)}}
function progressHtml(job){const done=new Set((job.progress||[]).map(x=>x.stage)),order=['understanding_request','resolving_constraints','generating_legal_builds','evaluating_candidates','analyzing_uncertainty','preparing_recommendation'];return `<div class="progress" id="jobProgress"><div class="progress-head"><span class="spinner"></span><div><b>${esc((job.stage||'understanding_request').replaceAll('_',' '))}</b><br><small>${fmt(job.detail)}</small></div></div><div class="steps">${order.map(x=>`<span class="step ${done.has(x)?'done':''} ${job.stage===x?'active':''}"></span>`).join('')}</div></div>`}
function messageHtml(m){if(m.role==='user')return `<div class="message user"><p>${esc(m.content)}</p></div>`;return `<div class="message assistant">${m.response?responseHtml(m.response):`<p>${esc(m.content)}</p>`}</div>`}
function responseHtml(r){if(r.status==='needs_clarification')return `<div class="split"><b>I need one detail</b>${badge('partial')}</div><p class="muted">${(r.questions||[]).map(esc).join(' ')}</p>`;if(r.analysis)return analysisHtml(r.analysis);if(r.comparison)return comparisonResultHtml(r.comparison);if(!r.recommendation)return `<p>${esc(r.explanation?.summary||'No recommendation was produced.')}</p>`;return `<div class="split"><b>Recommendation</b>${badge(r.recommendation.comparison_class==='definitive'?'supported':r.recommendation.confidence||'partial')}</div><p>${esc(r.explanation?.summary)}</p>${buildHtml(r.recommendation,r.explanation,r.synergy_chain)}${(r.assumptions||[]).length?`<div class="notice"><b>Assumption</b><br>${r.assumptions.map(esc).join('<br>')}</div>`:''}`}
function buildHtml(b,explanation={},chain=[]){const weapon=b.weapon||{},perks=weapon.selected_perks||[],ref=registerObject(b);return `<section class="build"><div class="build-head"><div><span class="label">${esc(b.comparison_class||'build')}</span><h3>${fmt(weapon.display_name||weapon.variant_key)}</h3></div><div><button class="btn small" onclick="pinObject('${ref}')">Pin to compare</button></div></div><div class="build-body"><div class="slots"><div class="slot"><span class="label">Commander</span><b>${fmt(b.commander?.display_name)}</b><small class="muted">${fmt(b.commander?.perk_family)}</small></div><div class="slot"><span class="label">Team perk</span><b>${fmt(b.team_perk?.display_name)}</b></div><div class="slot"><span class="label">Gadgets</span><b>${(b.gadgets||[]).map(x=>esc(x.display_name)).join(' + ')||'None'}</b></div></div><h4>Support team</h4><div class="slots">${(b.support_heroes||[]).map(x=>`<div class="slot"><b>${fmt(x.display_name)}</b><small class="muted">${fmt(x.perk_family)}</small></div>`).join('')||'<span class="muted">No supports specified.</span>'}</div><h4>Weapon perks</h4><div class="slots">${perks.map(x=>`<div class="slot"><span class="label">Slot ${fmt(x.slot_ordinal)}</span><b>${fmt(x.display_name||x.alteration_key)}</b>${badge(x.semantic_status||'partial')}</div>`).join('')||'<span class="muted">No perks supplied.</span>'}</div><div class="scores">${Object.entries(b.supported_score_components||{}).map(([k,v])=>`<span class="score">${esc(k.replaceAll('_',' '))}: ${v.status==='supported'?Number(v.normalized_score).toFixed(0):'unavailable'}</span>`).join('')}</div><h4>Why it works</h4>${(chain||[]).filter(x=>x.stage==='supported_effect').slice(0,6).map((x,i)=>`<div class="synergy"><span class="synergy-num">${i+1}</span><div><b>${fmt(x.value.origin_label||x.value.origin_kind)}</b><div class="muted">${fmt(x.value.attribute)} · ${fmt(x.value.operation)}</div></div></div>`).join('')||'<p class="muted">The relevant interaction remains partial or opaque.</p>'}<details class="details"><summary>Evidence and uncertainty</summary>${(explanation.evidence||[]).map(x=>`<div class="evidence ${esc(x.status)}">${badge(x.status)} ${esc(x.text)}</div>`).join('')}<p class="muted">Partial and opaque contributions are not treated as zero.</p></details></div></section>`}
function pinObject(ref){const build=state.objects[ref];if(build&&!state.pinned.some(x=>buildKey(x)===buildKey(build)))state.pinned.push(build);navigate('compare')}
const buildKey=b=>`${b.commander?.hero_key}|${b.weapon?.variant_key}|${(b.support_heroes||[]).map(x=>x.hero_key).join(',')}`;
async function loadConversation(id){state.conversationId=id;state.conversation=await api(`/api/ai/conversations/${id}`)}
async function newConversation(){state.conversationId=null;state.conversation=null;renderChat()}
async function renderChat(){let history=[];try{history=(await api('/api/ai/conversations')).conversations}catch{}content.innerHTML=`<div class="hero"><h2>Your STW build specialist</h2><p>Ask for a build, improve one you already use, or adapt it to a mission. Every recommendation comes from the local Fortnite catalog and deterministic evaluator.</p></div><div class="layout"><section class="panel chat"><div class="messages" id="messages">${(state.conversation?.messages||[]).map(messageHtml).join('')||`<div class="empty"><b>What are we building?</b><br>Try a weapon, hero, mission, or playstyle.</div>`}${state.job?progressHtml(state.job):''}</div><div class="composer"><div class="suggestions"><button class="suggestion" onclick="quick('Give me the strongest Nocturno loadout for 160s.')">Nocturno 160s</button><button class="suggestion" onclick="quick('Make me a Potshot build for deleting Smashers.')">Potshot vs Smashers</button><button class="suggestion" onclick="quick('Build around Paleo Luna.')">Paleo Luna</button><button class="suggestion" onclick="quick('Make this build more survivable without destroying its damage.')">More survivable</button></div><div class="compose-row"><textarea id="chatInput" placeholder="Ask your STW loadout question…"></textarea><button class="btn primary" onclick="sendChat()">Send</button></div></div></section><aside class="panel controls" style="position:static;height:auto"><div class="split"><h3 style="margin:0">Scenario & goals</h3><button class="btn small ghost" onclick="newConversation()">New chat</button></div><div class="field"><label>Mission</label><input id="ctxMission" placeholder="Ride the Lightning"></div><div class="grid"><div class="field"><label>Enemy</label><input id="ctxEnemy" placeholder="Smasher"></div><div class="field"><label>Power level</label><input id="ctxPl" type="number" placeholder="160"></div></div><div class="field"><label>Elemental storm</label><select id="ctxStorm"><option value="">Any</option><option>Fire</option><option>Water</option><option>Nature</option></select></div><p class="muted">Optional goal overrides</p><div class="field"><label>Damage priority</label><input id="goalDamage" type="range" min="0" max="100" value="0"></div><div class="field"><label>Survivability</label><input id="goalSurvival" type="range" min="0" max="100" value="0"></div><div class="field"><label>Crowd control</label><input id="goalControl" type="range" min="0" max="100" value="0"></div><div class="field"><label>Ability uptime</label><input id="goalUptime" type="range" min="0" max="100" value="0"></div><div class="field"><label>Mechanics to avoid</label><input id="ctxAvoid" placeholder="elimination_trigger"></div><label class="check"><input id="restrictOwned" type="checkbox">Only use my inventory</label><h4>Recent chats</h4><div class="history-list">${history.map(x=>`<div class="history-item ${x.id===state.conversationId?'active':''}" onclick="loadConversation('${esc(x.id)}').then(renderChat)">${esc(x.title)}</div>`).join('')||'<span class="muted">No saved chats yet.</span>'}</div></aside></div>`;const input=document.querySelector('#chatInput');input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}};setTimeout(()=>document.querySelector('#messages')?.lastElementChild?.scrollIntoView(),0)}
function analysisHtml(a){if(!a.legality?.legal)return `<div class="error"><b>Illegal loadout</b><ul>${(a.legality?.errors||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;return `<div class="split"><b>Loadout analysis</b>${badge(a.evaluation?.status||'partial')}</div><div class="grid" style="margin-top:12px"><div class="card"><span class="label">Active synergies</span><div class="value">${(a.major_synergies||[]).length}</div></div><div class="card"><span class="label">Weak links</span><div class="value">${(a.weak_links||[]).length}</div></div><div class="card"><span class="label">Replacement paths</span><div class="value">${(a.replacement_candidates||[]).length}</div></div></div><h4>Weak links</h4><ul>${(a.weak_links||[]).slice(0,10).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>No supported weak link was found.</li>'}</ul><h4>Redundant slots</h4>${(a.wasted_or_redundant_slots||[]).map(x=>`<div class="notice">${esc(x.heroes.join(' + '))}: ${esc(x.reason)}</div>`).join('')||'<p class="muted">No duplicate normalized perk families found.</p>'}`}
async function runAnalysis(){const value=id=>document.querySelector(`#${id}`).value.trim(),supports=value('anSupports').split(',').map(x=>x.trim()).filter(Boolean),gadgets=value('anGadgets').split(',').map(x=>x.trim()).filter(Boolean);const intent={schema_version:'stw.build-intent.v1',mode:'analyze',weapon:value('anWeapon'),target_enemy:value('anEnemy')||'default__huskpawn_c',objective_weights:{sustained_damage:1},support_slots:supports.length,gadget_slots:gadgets.length,current_loadout:{weapon:value('anWeapon'),commander:value('anCommander')||null,support_heroes:supports,team_perk:value('anTeam')||null,gadgets}};try{const job=await post('/api/ai/jobs',{request:'Analyze my current loadout',intent});document.querySelector('#analysisResult').innerHTML=progressHtml(job);const done=await waitForJob(job.id);document.querySelector('#analysisResult').innerHTML=done.status==='completed'?responseHtml(done.result):`<div class="error">${esc(done.error)}</div>`}catch(e){document.querySelector('#analysisResult').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function waitForJob(id){while(true){const j=await api(`/api/ai/jobs/${id}`);if(['completed','failed'].includes(j.status))return j;const p=document.querySelector('#jobProgress');if(p)p.outerHTML=progressHtml(j);await new Promise(r=>setTimeout(r,400))}}
function renderAnalyzer(){content.innerHTML=`<div class="hero"><h2>Find the weak link</h2><p>Enter a complete or partial loadout. The analyzer checks legality, proven synergy, conflicting conditions, uncertainty, and the highest-value replacements it can defend.</p></div><div class="layout"><section class="panel"><div class="grid"><div class="field"><label>Exact weapon variant</label><input id="anWeapon" placeholder="WID_Assault_Auto_Founders_SR_Ore_T05"></div><div class="field"><label>Commander</label><input id="anCommander" placeholder="Rescue Trooper Ramirez"></div></div><div class="field"><label>Support heroes — comma separated</label><input id="anSupports" placeholder="Support 1, Support 2, Support 3, Support 4, Support 5"></div><div class="grid"><div class="field"><label>Team perk</label><input id="anTeam" placeholder="Team perk"></div><div class="field"><label>Gadgets — comma separated</label><input id="anGadgets" placeholder="Adrenaline Rush, Slow Field"></div><div class="field"><label>Target</label><input id="anEnemy" placeholder="default__smasherpawn_c"></div></div><button class="btn primary" onclick="runAnalysis()">Analyze loadout</button></section><section id="analysisResult" class="stack"><div class="panel empty">Your evidence-backed analysis will appear here.</div></section></div>`}
async function searchInventory(){const kind=document.querySelector('#invKind').value,q=document.querySelector('#invQuery').value;try{const d=await api(`/api/ai/catalog?kind=${encodeURIComponent(kind)}&query=${encodeURIComponent(q)}&limit=25`);document.querySelector('#invResults').innerHTML=d.items.map(inventoryResultHtml).join('')||'<div class="empty">No catalog matches.</div>'}catch(e){document.querySelector('#invResults').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function inventoryResultHtml(x){const owned=state.inventory.some(i=>i.entity_kind===x.kind&&i.entity_key===x.entity_key&&i.owned),ref=registerObject(x);return `<div class="inventory-item ${owned?'owned':''}"><div><b>${fmt(x.display_name)}</b><small class="muted" style="display:block">${esc(x.kind)} · ${esc(x.semantic_status)}</small></div><button class="btn small" onclick="saveInventory('${ref}',${!owned})">${owned?'Owned ✓':'Add'}</button></div>`}
async function saveInventory(ref,owned){const x=state.objects[ref];await post('/api/ai/inventory',{entity_kind:x.kind,entity_key:x.entity_key,display_name:x.display_name,owned});await renderInventory()}
async function renderInventory(){try{state.inventory=(await api('/api/ai/inventory')).items}catch{state.inventory=[]}content.innerHTML=`<div class="hero"><h2>Optimize for what you actually own</h2><p>Add heroes, weapon families, team perks, and gadgets. Enable “Only use my inventory” in chat to restrict the legal search space.</p></div><section class="panel"><div class="grid"><div class="field"><label>Content type</label><select id="invKind"><option value="hero">Heroes</option><option value="weapon">Weapons</option><option value="team_perk">Team perks</option><option value="gadget">Gadgets</option></select></div><div class="field"><label>Search the local catalog</label><div class="compose-row"><input id="invQuery" placeholder="Search by name"><button class="btn primary" onclick="searchInventory()">Search</button></div></div></div><h3>Owned (${state.inventory.filter(x=>x.owned).length})</h3><div class="inventory-results">${state.inventory.filter(x=>x.owned).map(x=>inventoryResultHtml({kind:x.entity_kind,entity_key:x.entity_key,display_name:x.display_name,semantic_status:'cataloged'})).join('')||'<div class="empty">Nothing added yet. Search above to build your inventory.</div>'}</div><h3>Search results</h3><div id="invResults" class="inventory-results"></div></section>`}
function recommendationToLoadout(b){return {weapon:b.weapon?.variant_key,weapon_perks:(b.weapon?.selected_perks||[]).map(x=>({slot:x.slot_ordinal,perk:x.alteration_key})),commander:b.commander?.hero_key,support_heroes:(b.support_heroes||[]).map(x=>x.hero_key),team_perk:b.team_perk?.key||null,gadgets:(b.gadgets||[]).map(x=>x.key)}}
async function comparePinned(){if(state.pinned.length<2)return;const intent={schema_version:'stw.build-intent.v1',mode:'compare',weapon:state.pinned[0].weapon?.variant_key,target_enemy:'default__huskpawn_c',objective_weights:{sustained_damage:1},comparison_loadouts:state.pinned.slice(0,2).map(recommendationToLoadout)};try{const job=await post('/api/ai/jobs',{request:'Compare these two builds',intent});document.querySelector('#compareResult').innerHTML=progressHtml(job);const done=await waitForJob(job.id);document.querySelector('#compareResult').innerHTML=done.status==='completed'?responseHtml(done.result):`<div class="error">${esc(done.error)}</div>`}catch(e){document.querySelector('#compareResult').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function comparisonResultHtml(c){return `<div class="split"><b>Same-scenario comparison</b>${badge(c.definitive?'supported':'partial')}</div>${c.reason?`<div class="notice">${esc(c.reason)}</div>`:''}<div class="grid" style="margin-top:10px">${(c.builds||[]).map((x,i)=>`<div class="card"><span class="label">Build ${i+1}</span><div class="value">${esc(x.status)}</div><p class="muted">Burst: ${fmt(x.metrics?.burst_dps)}<br>Sustained: ${fmt(x.metrics?.sustained_dps)}</p></div>`).join('')}</div>`}
function renderCompare(){content.innerHTML=`<div class="hero"><h2>Compare the evidence, not just one score</h2><p>Pin recommendations from chat. Calculations are compared under one target scenario, with uncertainty shown separately.</p></div><div class="compare-grid">${state.pinned.slice(0,2).map((b,i)=>`<section class="panel"><div class="split"><h3>Build ${i+1}</h3><button class="btn small" onclick="state.pinned.splice(${i},1);renderCompare()">Remove</button></div>${buildHtml(b)}</section>`).join('')||'<div class="panel empty">Pin two builds from AI Chat to compare them.</div>'}</div><div style="margin:14px 0"><button class="btn primary" ${state.pinned.length<2?'disabled':''} onclick="comparePinned()">Compare pinned builds</button></div><section id="compareResult" class="panel empty">The supported calculation and uncertainty comparison will appear here.</section>`}
function timeline(events=[]){return events.length?`<ul class="timeline">${events.map(e=>`<li><b>${fmt(e.event_type||e.state)}</b> ${fmt(e.occurred_at)} · ${fmt(e.participant||e.reason)} · team ${fmt(e.team_size_after)}</li>`).join('')}</ul>`:'<p class="muted">No events observed yet.</p>'}
async function renderLive(){const d=await api('/api/current'),a=d.attempt;content.innerHTML=`<div class="grid"><section class="card"><div class="label">State</div><div class="value">${fmt(d.state)}</div><div class="muted">${fmt(d.reason)}</div></section><section class="card"><div class="label">Mission</div><div class="value">${a?`PL${fmt(a.power_level)} ${fmt(a.objective)}`:'Unknown'}</div></section><section class="card"><div class="label">Route</div><div class="value">${a?`${fmt(a.requested_region)} → ${fmt(a.datacenter)}`:'Unknown'}</div></section><section class="card"><div class="label">Assignment</div><div class="value">${a?secs(a.assignment_elapsed_seconds):'Unknown'}</div></section><section class="card"><div class="label">Lobby</div><div class="value">${a?fmt(a.current_team_size):'Unknown'}</div></section></div><section class="panel" style="margin-top:12px"><h2>Teammate timeline</h2>${timeline(a?.membership_events)}</section>`}
async function renderHistory(){if(state.selectedAttempt){const a=await api(`/api/attempts/${state.selectedAttempt}`);content.innerHTML=`<button class="btn" onclick="state.selectedAttempt=null;renderHistory()">← Back</button><h2>PL${fmt(a.power_level)} ${fmt(a.objective)}</h2><div class="grid"><div class="card"><span class="label">Outcome</span><div class="value">${fmt(a.outcome)}</div></div><div class="card"><span class="label">Route</span><div class="value">${fmt(a.requested_region)} → ${fmt(a.datacenter)}</div></div><div class="card"><span class="label">Latency</span><div class="value">${secs(a.assignment_latency_seconds)}</div></div><div class="card"><span class="label">Final team</span><div class="value">${fmt(a.current_team_size)}</div></div></div><section class="panel" style="margin-top:12px">${timeline(a.state_events)}${timeline(a.membership_events)}</section>`;return}const d=await api('/api/attempts?limit=50');content.innerHTML=`<table><thead><tr><th>Time</th><th>Mission</th><th>Route</th><th>Latency</th><th>Team</th><th>Outcome</th></tr></thead><tbody>${d.attempts.map(a=>`<tr onclick="state.selectedAttempt=${a.id};renderHistory()"><td>${fmt(a.started_at)}</td><td>PL${fmt(a.power_level)} ${fmt(a.objective)}</td><td>${fmt(a.requested_region)} → ${fmt(a.datacenter)}</td><td>${secs(a.assignment_latency_seconds)}</td><td>${fmt(a.current_team_size)}</td><td>${fmt(a.outcome)}</td></tr>`).join('')}</tbody></table>`}
async function renderActivity(){const [d,t]=await Promise.all([api('/api/activity/current'),api('/api/recommendation/current')]),q=t.recommendation;content.innerHTML=`<div class="notice">${fmt(t.definition)}</div><section class="hero"><span class="label">Observed recommendation</span><h2>${fmt(q.headline)}</h2><p>${fmt(q.summary)}</p></section><div class="grid">${d.regions.map(r=>`<section class="card"><div class="split"><b>${fmt(r.region)}</b>${badge(r.confidence)}</div><div class="value">${Number(r.score).toFixed(1)}</div><div class="muted">${fmt(r.sample_count)} samples · ${secs(r.median_assignment_latency_seconds)}</div></section>`).join('')}</div>`}
async function renderMissions(){const d=await api('/api/missions/current'),r=d.rotation;content.innerHTML=`${r&&(r.is_fixture||r.freshness!=='current')?`<div class="notice">${r.is_fixture?'Fixture provider data. ':''}Freshness: ${fmt(r.freshness)}.</div>`:''}<div class="grid">${d.missions.map(m=>`<section class="card"><span class="label">${fmt(m.theater_name||m.theater_code)}</span><h3>PL${fmt(m.power_level)} ${fmt(m.objective)}</h3><p class="muted">${fmt(m.biome_name||m.biome_code)} · ${m.is_four_player?'Four player':'Standard'}</p><p><b>Rewards</b><br>${m.rewards.map(x=>`${fmt(x.quantity)}× ${fmt(x.display_name)}`).join(', ')||'None supplied'}</p><p><b>Modifiers</b><br>${m.modifiers.map(x=>fmt(x.display_name)).join(', ')||'None supplied'}</p></section>`).join('')||'<div class="empty">No provider rotation loaded.</div>'}</div>`}
async function renderSettings(){const [s,d,c]=await Promise.all([api('/api/settings'),api('/api/diagnostics'),api('/api/ai/config')]);content.innerHTML=`<div id="notice"></div><div class="grid"><section class="panel"><h3>Application</h3><div class="field"><label>Fortnite log path</label><input id="logPath" value="${esc(s.configured_log_path||s.active_log_path||'')}"></div><div class="field"><label>Local timezone</label><input id="timezone" value="${esc(s.timezone)}"></div><div class="field"><label>History retention days</label><input id="retention" type="number" value="${fmt(s.history_retention_days)}"></div><div class="field"><label>Backups to keep</label><input id="backupKeep" type="number" value="${fmt(s.backup_keep)}"></div><label class="check"><input id="autoBackup" type="checkbox" ${s.auto_backup_on_start?'checked':''}>Verified backup at startup</label><button class="btn primary" id="saveSettings" style="margin-top:12px">Save settings</button></section><section class="panel"><h3>Loadout AI</h3><p>Provider: <b>${fmt(c.provider)}</b></p><p>Asset catalog: ${c.asset_database_ready?badge('supported'):badge('opaque')}</p><p class="muted">${fmt(c.asset_database)}</p><p>Model: <b>${fmt(c.provider_metrics?.model)}</b></p><p>Last latency: <b>${c.provider_metrics?.last_latency_ms?`${Number(c.provider_metrics.last_latency_ms).toFixed(0)}ms`:'No provider call yet'}</b></p><p class="muted">API keys are read from environment variables and never returned to this page.</p></section><section class="panel"><h3>Privacy</h3><p>Storage: <b>${fmt(s.privacy.storage_scope)}</b></p><p>Teammates: <b>${fmt(s.privacy.participant_identifiers)}</b></p><p class="muted">Conversation and inventory data remain in the local application database.</p></section></div><h3>System checks — ${fmt(d.status)}</h3><div class="grid">${d.checks.map(x=>`<section class="card"><span class="label">${fmt(x.name)}</span><div class="value">${fmt(x.status)}</div><div class="muted">${fmt(x.detail)}</div></section>`).join('')}</div>`;document.querySelector('#saveSettings').onclick=async()=>{try{const r=await post('/api/settings',{configured_log_path:document.querySelector('#logPath').value,timezone:document.querySelector('#timezone').value,history_retention_days:Number(document.querySelector('#retention').value),backup_keep:Number(document.querySelector('#backupKeep').value),auto_backup_on_start:document.querySelector('#autoBackup').checked});document.querySelector('#notice').innerHTML=`<div class="notice">Saved.${r.restart_required?' Restart required for the log path.':''}</div>`}catch(e){document.querySelector('#notice').innerHTML=`<div class="error">${esc(e.message)}</div>`}}}
async function refreshStatus(){try{const [h,c]=await Promise.all([api('/api/health'),api('/api/ai/config')]);health.textContent=`Watcher ${h.watchers[0]?.status||'not configured'} · catalog ${c.asset_database_ready?'ready':'missing'}`;providerEl.textContent=c.provider_metrics?.model||c.provider||'Local AI';state.provider=c}catch{health.textContent='Local service unavailable'}}
async function render(){try{if(state.view==='chat')await renderChat();else if(state.view==='analyzer')renderAnalyzer();else if(state.view==='inventory')await renderInventory();else if(state.view==='compare')renderCompare();else if(state.view==='live')await renderLive();else if(state.view==='history')await renderHistory();else if(state.view==='activity')await renderActivity();else if(state.view==='missions')await renderMissions();else await renderSettings()}catch(e){errorBox(e)}refreshStatus()}
render();setInterval(()=>{if(['live','activity'].includes(state.view)&&!state.job)render()},2000);
</script>
</body>
</html>
