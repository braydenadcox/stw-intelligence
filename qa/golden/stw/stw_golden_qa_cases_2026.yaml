schema_version: 1
benchmark_id: stw-golden-qa-2026
generated_from_sources: stw_golden_qa_sources_2026.yaml

purpose: >-
  Golden QA cases for an STW optimizer or recommendation system. They test mechanics,
  constraints, tradeoffs, and conditional ranking behavior without embedding creator
  tier lists as canonical game data.

enforcement_levels:
  hard_invariant: Failing this case should block a release after asset/runtime verification.
  ranking_expectation: Directional expert baseline; log a regression and review rather than auto-block.
  contextual: Must be recognized only when its stated scenario is active.
  quarantine: Keep visible, but never score as current truth until revalidated.

oracle_types:
  exact_state: Output must contain the specified state or multiplier.
  required_factors: Output must account for every listed factor before recommending.
  relative_rank: Candidate should outrank control under the supplied fixtures.
  forbidden_conclusion: Output must not make the listed unconditional conclusion.
  manual_runtime: A runtime behavior must be tested; prose agreement is insufficient.

